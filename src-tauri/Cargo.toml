[package]
name = "pigma-desktop"
version = "0.1.0"
edition = "2021"
description = "Pigma desktop shell: the editor plus a loopback MCP endpoint"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Asset auto-update (src/assets.rs): fetch the manifest and the assets, verify
# every sha256. rustls keeps the shell free of an OpenSSL system dependency.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"

[features]
default = []
