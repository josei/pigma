# Build the Pigma desktop app on each platform (see ROADMAP M17 and docs/DESKTOP.md).
# A build runs when the desktop shell or this workflow changes on main, and on demand.
# Each platform uploads its bundles as an artifact. Builds are unsigned for now.
name: Desktop

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/desktop-assets.mjs'
      - 'scripts/build-servers.mjs'
      - 'server/**'
      - 'src/mcp/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build the desktop app
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: pigma-desktop-${{ matrix.name }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
